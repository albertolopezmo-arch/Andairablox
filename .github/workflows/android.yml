name: Publicar APK en Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android
        uses: android-actions/setup-android@v4
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Copiar interfaz
        run: |
          mkdir -p android/app/src/main/assets
          cp -R web/. android/app/src/main/assets/
      - name: Crear APK de prueba instalable
        run: gradle --no-daemon :android:app:assembleDebug
      - name: Preparar descarga
        shell: bash
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/debug/app-debug.apk release-files/Quiz-LQSA-prueba.apk
          cd release-files
          sha256sum Quiz-LQSA-prueba.apk > SHA256SUMS.txt
      - name: Publicar descarga en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || format('prueba-{0}-{1}', github.run_number, github.run_attempt) }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            release-files/Quiz-LQSA-prueba.apk
            release-files/SHA256SUMS.txt
          fail_on_unmatched_files: true
      - name: Mostrar enlace de descarga
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || format('prueba-{0}-{1}', github.run_number, github.run_attempt) }}
        run: |
          echo "### APK disponible" >> "$GITHUB_STEP_SUMMARY"
          echo "[Abrir Release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})" >> "$GITHUB_STEP_SUMMARY"
