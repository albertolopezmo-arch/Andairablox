<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Quiz LQSA</title><link rel="icon" type="image/png" href="app-icon.png"><link rel="apple-touch-icon" href="app-icon.png"><link rel="stylesheet" href="styles.css"></head>
<body class="splash-open"><div id="app-splash" role="status" aria-label="Iniciando Quiz LQSA" style="position:fixed;inset:0;z-index:10000;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 12px 50px">
<img id="splash-art" src="splash.webp" alt="Quiz LQSA Fans" style="width:100%;height:100%;object-fit:contain;min-height:0">
<div id="splash-progress" role="progressbar" aria-label="Inicio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(54%,230px);height:8px;background:#eee;border-radius:10px;overflow:hidden"><span id="splash-fill" style="display:block;height:100%;width:0;background:#ffe000;border-radius:10px"></span></div></div>
<script src="splash.js"></script><div class="app-shell" inert>
<header class="wallet" aria-label="Tu perfil y saldo">
<a class="wallet-profile" href="#profile" aria-label="Ver tu perfil"><img id="wallet-avatar" alt="Tu avatar" width="40" height="40" hidden><span id="wallet-alias">Tu perfil</span></a>
<div class="wallet-balances">
<div class="balance"><span class="balance-icon" aria-hidden="true">★</span><div><span class="balance-label">PUNTOS</span><strong id="points" aria-live="polite">0</strong></div></div>
<div class="balance"><svg class="wallet-coin" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#ffe000" stroke="#b77c00" stroke-width="3"/><circle cx="20" cy="20" r="13.5" fill="none" stroke="#bd8800" stroke-width="1.5"/><path d="m20 9 3.2 6.5 7.2 1-5.2 5.1 1.2 7.2-6.4-3.4-6.4 3.4 1.2-7.2-5.2-5.1 7.2-1z" fill="#111"/></svg><div><span class="balance-label">MONEDAS</span><strong id="coins" aria-live="polite">0</strong></div></div>
<div class="balance wallet-streak"><span class="streak-icon" aria-hidden="true">🔥</span><div><span class="balance-label">RACHA</span><strong id="wallet-streak" aria-live="polite">0</strong></div></div>
</div></header>
<main id="main"><section id="setup" class="profile-setup" aria-label="Crea tu perfil" hidden>
<img src="profile-setup.png" alt="Crea tu perfil: elige un alias y un avatar" width="853" height="1844" draggable="false">
<form id="profile-form" novalidate>
<label class="sr-only" for="alias">Tu alias</label><input id="alias" class="alias-input" placeholder="Escribe tu alias…" autocomplete="nickname" maxlength="20" aria-describedby="profile-error">
<span id="alias-status" class="alias-status" role="status" aria-live="polite"></span>
<button type="button" id="random-alias" class="transparent-control alias-dice" aria-label="Sugerir un alias al azar"></button>
<p id="profile-error" class="profile-error" role="alert"></p>
<div id="avatar-grid" class="avatar-grid" role="group" aria-label="Elige tu avatar"></div>
<nav id="avatar-pages" class="avatar-pages" aria-label="Páginas de avatares"></nav>
<button type="submit" id="profile-continue" disabled class="transparent-control profile-continue" aria-label="Guardar perfil y continuar"></button>
</form></section><section id="home" class="home-art" aria-label="Inicio de Quiz LQSA">
<img src="home.png" alt="Quiz LQSA: desafío diario, duelo, ranking, tienda y perfil" width="853" height="1844" fetchpriority="high" draggable="false">
<a class="hotspot daily" href="#daily" aria-label="Daily: jugar al desafío diario"><span class="sr-only">Jugar al Daily</span></a>
<a class="hotspot duel" href="#duel" aria-label="Duelo: competir contra otros vecinos"><span class="sr-only">Duelo</span></a>
<a class="hotspot ranking" href="#ranking" aria-label="Ver ranking"><span class="sr-only">Ranking</span></a>
<a class="hotspot shop" href="#shop" aria-label="Abrir tienda"><span class="sr-only">Tienda</span></a>
<a class="hotspot profile" href="#profile" aria-label="Abrir perfil"><span class="sr-only">Perfil</span></a>
</section><section id="section-page" class="section-page" hidden><a href="#home" class="back">‹ VOLVER AL INICIO</a><span id="section-icon" class="section-icon" aria-hidden="true"></span><h1 id="section-title" tabindex="-1"></h1><p id="section-copy"></p><div id="section-content"></div></section></main>
<footer class="footer">QUIZ LQSA</footer></div><script src="supabase-config.js"></script><script type="module" src="app.js"></script></body></html>
