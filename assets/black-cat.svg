 <radialGradient id="haunch" cx=".3" cy=".2" r=".8"><stop stop-color="#4b4856"/><stop offset=".45" stop-color="#252530"/><stop offset="1" stop-color="#0a0b12"/></radialGradient>
 <radialGradient id="face" cx=".29" cy=".13" r=".91"><stop stop-color="#5a5665"/><stop offset=".28" stop-color="#34333f"/><stop offset=".65" stop-color="#1c1c27"/><stop offset="1" stop-color="#090b13"/></radialGradient>
 <radialGradient id="muzzle" cx=".38" cy=".22" r=".8"><stop stop-color="#4d4858"/><stop offset=".5" stop-color="#2a2736"/><stop offset="1" stop-color="#171622"/></radialGradient>
 <linearGradient id="leg" x1="0" x2="1"><stop stop-color="#42404e"/><stop offset=".36" stop-color="#24242e"/><stop offset="1" stop-color="#101119"/></linearGradient>
 <linearGradient id="far" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24222d"/><stop offset="1" stop-color="#080911"/></linearGradient>
 <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63596d"/><stop offset=".25" stop-color="#3d354b"/><stop offset="1" stop-color="#11121c"/></linearGradient>
 <linearGradient id="tail" x1="0" y1="0" x2="1" y2=".6"><stop stop-color="#4e455d"/><stop offset=".35" stop-color="#282633"/><stop offset="1" stop-color="#12121d"/></linearGradient>
 <radialGradient id="iris" cx=".35" cy=".3" r=".7"><stop stop-color="#fff9bd"/><stop offset=".35" stop-color="#ffe75c"/><stop offset=".75" stop-color="#e6ae21"/><stop offset="1" stop-color="#91701d"/></radialGradient>
 <radialGradient id="shadow"><stop stop-color="#000" stop-opacity=".65"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <linearGradient id="rim"><stop stop-color="#d6b5ef" stop-opacity=".62"/><stop offset=".7" stop-color="#9a7fba" stop-opacity=".1"/><stop offset="1" stop-color="#8571a4" stop-opacity="0"/></linearGradient>
</defs>
<style>
 .cat-shadow{animation:shadow-breathe .8s ease-in-out infinite alternate;transform-origin:126px 149px}
 .tail{transform-origin:67px 105px;animation:tail-sway 2s ease-in-out infinite alternate}
 .body{animation:body-bob .8s ease-in-out infinite alternate}
 .far-front{transform-origin:159px 111px;animation:step .8s ease-in-out infinite alternate}
 .far-back{transform-origin:95px 112px;animation:step .8s ease-in-out infinite alternate-reverse}
 .near-front{transform-origin:166px 111px;animation:step .8s ease-in-out infinite alternate-reverse}
 .near-back{transform-origin:86px 112px;animation:step .8s ease-in-out infinite alternate}
 .head{transform-origin:162px 95px;animation:head-bob 1.6s ease-in-out infinite alternate}
 @keyframes step{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
 @keyframes body-bob{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
 @keyframes head-bob{from{transform:rotate(-1deg)}to{transform:rotate(1.4deg)}}
 @keyframes tail-sway{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
 @keyframes shadow-breathe{from{transform:scaleX(1);opacity:.6}to{transform:scaleX(.94);opacity:.45}}
 @media(prefers-reduced-motion:reduce){.cat-shadow,.tail,.body,.far-front,.far-back,.near-front,.near-back,.head{animation:none}}
</style>
